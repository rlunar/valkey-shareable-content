  <script>
    (function () {
      "use strict";
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });
      var signalIds = ["#f12-signal-1", "#f12-signal-2", "#f12-signal-3", "#f12-signal-4", "#f12-signal-5"];
      var barIds = ["#f12-bar-1", "#f12-bar-2", "#f12-bar-3", "#f12-bar-4"];
      var chartLine = document.getElementById("f12-chart-line");
      var chartLength = chartLine.getTotalLength();

      gsap.set(signalIds, { x: 0 });
      gsap.set(barIds, { scaleY: 0 });
      gsap.set(chartLine, { strokeDasharray: chartLength, strokeDashoffset: chartLength });
      gsap.set("#f12-flow-sweep", { x: 0 });

      /* Headline waterfall: fully readable before 0.6s. */
      tl.set("#f12-kicker", { opacity: 1, y: 58 }, 0.10);
      tl.to("#f12-kicker", { y: 0, duration: 0.20, ease: "power4.out" }, 0.10);
      tl.set("#f12-claim", { opacity: 1, y: 74 }, 0.22);
      tl.to("#f12-claim", { y: 0, duration: 0.28, ease: "power4.out" }, 0.22);

      /* Five finite packets enter, then the complete stream compacts into the
         chart intake. Every start is authored from index; no wall-clock state. */
      tl.set("#f12-stream-stage", { opacity: 1 }, 0.58);
      for (var i = 0; i < signalIds.length; i++) {
        var packetStart = 0.62 + i * 0.075;
        tl.set(signalIds[i], { opacity: 1 }, packetStart);
        tl.to(signalIds[i], { x: 630, duration: 0.54, ease: "power3.inOut" }, packetStart);
      }
      tl.set("#f12-flow-sweep", { opacity: 1 }, 0.68);
      tl.to("#f12-flow-sweep", { x: 690, duration: 0.62, ease: "none" }, 0.68);
      tl.to("#f12-flow-sweep", { opacity: 0, duration: 0.10, ease: "power2.in" }, 1.20);

      tl.fromTo("#f12-chart-window",
        { x: 70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.30, ease: "power3.out" },
        1.20);
      tl.to("#f12-stream-stage", {
        x: 760,
        scale: 0.14,
        opacity: 0,
        duration: 0.34,
        ease: "power3.in"
      }, 1.24);

      /* Observability payoff: icon-derived bars assemble, then the white trace
         resolves to the single action-blue newest sample. */
      for (var b = 0; b < barIds.length; b++) {
        var barStart = 1.44 + b * 0.08;
        tl.set(barIds[b], { opacity: 1 }, barStart);
        tl.to(barIds[b], { scaleY: 1, duration: 0.26, ease: "power3.out" }, barStart);
      }
      tl.to(chartLine, { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" }, 1.50);
      tl.set("#f12-chart-end", { opacity: 1, scale: 0.65 }, 1.86);
      tl.to("#f12-chart-end", { scale: 1, duration: 0.16, ease: "power3.out" }, 1.86);

      tl.seek(0);
      window.__timelines["12-iot"] = tl;
    })();
