<template>
  <link rel="stylesheet" href="open-sans-embedded.css">
  <link rel="stylesheet" href="brand-rail.css">
  <style>
    /* ── 03-capability · Valkey · rotary-feature-cycle ───────────────────────
       ONE DATASTORE FOR / eight common Valkey workloads on one rotary drum.
       1920x1080 @ 30fps · 5.3s · alternating FRAME.md grounds and text tokens.
       Sizes are FRAME.md ramp tokens resolved against 1920 (px = cqw / 100 * 1920).
       The wrapper seam (LEFT in / LEFT out on #f3-line) is stamped from
       ledger.json — nothing here authors it. Internal motion only.
       ──────────────────────────────────────────────────────────────────────── */

    #f3-root, #f3-root *, #f3-root *::before, #f3-root *::after {
      box-sizing: border-box;
    }

    #f3-root, #f3-ground, #f3-line, #f3-stack, #f3-anchor, #f3-fit,
    #f3-drum, #f3-drum-sizer, #f3-axis, #f3-cyl, .f3-slot, .f3-face, #f3-rule {
      margin: 0;
      padding: 0;
    }

    #f3-root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
    }

    /* full-bleed ground rides its own clip layer, never the composition root */
    #f3-ground, #f3-line {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    #f3-ground { background-color: #30176e; }            /* components.ground-section */

    /* The line group the ledger's seam moves. The internal settle lives on
       #f3-stack so the seam's x on #f3-line and the nudge never fight for one
       property. */
    #f3-stack {
      position: absolute;
      left: 96px;                                        /* spacing.frame-pad · 5cqw */
      top: 366px;                                        /* anchor baseline on the upper golden line */
      width: fit-content;
    }

    /* typography.card-head 2.4cqw, 700 */
    #f3-anchor {
      font-family: 'Open Sans';
      font-size: 46.08px;
      font-weight: 700;
      line-height: 1.05;
      color: #fff;
      white-space: nowrap;
    }

    #f3-fit {
      width: fit-content;
      margin-top: 40px;                                  /* spacing.m */
    }

    /* Geometry adapted from rotary.html at commit 6259ea7aa45042fa6ebf941538cf7621cf6dad0f:
       https://github.com/heygen-com/hyperframes-launches/blob/6259ea7aa45042fa6ebf941538cf7621cf6dad0f/HF-heygen-stripe/compositions/rotary.html */
    #f3-drum {
      position: relative;
      width: fit-content;
      height: 14cqw;
      opacity: 0;
      perspective: 60cqw;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.25) 16%, #000 38%, #000 62%, rgba(0,0,0,.25) 84%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.25) 16%, #000 38%, #000 62%, rgba(0,0,0,.25) 84%, transparent 100%);
    }

    /* Deterministic widest-face sizing; no font-ready callback or measurement. */
    #f3-drum-sizer {
      width: max-content;
      height: 0;
      overflow: hidden;
      visibility: hidden;
      font-family: 'Open Sans';
      font-size: 153.6px;                                /* typography.stat-numeral · 8cqw */
      font-weight: 700;
      line-height: 0;
      letter-spacing: -1.92px;                           /* -0.1cqw */
      white-space: nowrap;
    }

    /* Perspective viewport → depth compensation → preserve-3D cylinder.
       A slot wrapper keeps rotate-then-radius geometry while all spatial state
       is authored with GSAP transform aliases. */
    #f3-axis, #f3-cyl, .f3-slot {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    #f3-cyl { will-change: transform; }

    .f3-face {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      text-align: center;
      font-family: 'Open Sans';
      font-size: 153.6px;                                /* typography.stat-numeral · 8cqw */
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -1.92px;
      color: #6983ff;
      white-space: nowrap;
      transform-origin: 50% 50%;
      -webkit-backface-visibility: hidden;
              backface-visibility: hidden;
    }

    /* components.rule-hairline — the frame's one action-blue atom */
    #f3-rule {
      height: 4px;
      margin-top: 20px;                                  /* spacing.s */
      background-color: #0053b8;                         /* colors.action-blue */
    }
  </style>

  <div data-hf-id="hf-dpkf" id="f3-root" data-composition-id="03-capability" data-width="1920" data-height="1080">
    <div data-hf-id="hf-3ie3" id="f3-ground" class="clip" data-start="0" data-duration="5.3" data-track-index="0"></div>
    <div data-hf-id="hf-hczn" id="f3-line" class="clip" data-start="0" data-duration="5.3" data-track-index="1">
      <div data-hf-id="hf-xgyb" id="f3-stack">
        <div data-hf-id="hf-yseo" id="f3-anchor">ONE DATASTORE FOR</div>
        <div data-hf-id="hf-dlc2" id="f3-fit">
          <div data-hf-id="hf-s8m4" id="f3-drum">
            <div data-hf-id="hf-wafn" id="f3-drum-sizer" aria-hidden="true">PRIMARY DATABASE.</div>
            <div data-hf-id="hf-2try" id="f3-axis">
              <div data-hf-id="hf-qr6r" id="f3-cyl"></div>
            </div>
          </div>
          <div data-hf-id="hf-umy3" id="f3-rule"></div>
        </div>
      </div>
      <div data-hf-id="f3-feedback-brand-rail" class="feedback-brand-rail feedback-brand-rail--dynamic">
        <img data-hf-id="f3-feedback-brand-logo" id="f3-feedback-brand-logo" src="assets/valkey-logo.svg" alt="Valkey">
        <span data-hf-id="f3-feedback-brand-url" id="f3-feedback-brand-url">valkey.io</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      window.__timelines = window.__timelines || {};

      var F = 1 / 30;                 // one frame @ 30fps
      var STEP = 30;                  // degrees between feature planes
      var RADIUS = "13cqw";           // matched face depth and axis compensation
      var FEATURES = [
        "CACHING.",
        "MESSAGE QUEUES.",
        "PRIMARY DATABASE.",
        "SESSIONS.",
        "LEADERBOARDS.",
        "CHATBOTS.",
        "IOT STREAMS.",
        "GEOSPATIAL."
      ];

      var groundEl = document.getElementById("f3-ground");
      var anchorEl = document.getElementById("f3-anchor");
      var drumEl = document.getElementById("f3-drum");
      var axisEl = document.getElementById("f3-axis");
      var cylEl = document.getElementById("f3-cyl");
      var ruleEl = document.getElementById("f3-rule");
      var stackEl = document.getElementById("f3-stack");
      var railLogo = document.getElementById("f3-feedback-brand-logo");
      var railUrl = document.getElementById("f3-feedback-brand-url");
      var slots = [];
      var faces = [];

      /* Twelve unique physical angles avoid duplicate faces while still covering
         every stop in the +210deg run. At rest n=0 is CACHING.; each +30deg
         turn advances one entry until n=7 brings GEOSPATIAL. to the front. */
      for (var n = -4; n <= 7; n++) {
        var slot = document.createElement("div");
        var face = document.createElement("div");
        slot.className = "f3-slot";
        slot.setAttribute("data-layout-allow-overflow", "");
        face.className = "f3-face";
        face.setAttribute("data-layout-allow-overlap", "");
        face.setAttribute("data-layout-allow-overflow", "");
        face.setAttribute("data-layout-allow-occlusion", "");
        face.textContent = FEATURES[((n % FEATURES.length) + FEATURES.length) % FEATURES.length];
        slot.appendChild(face);
        cylEl.appendChild(slot);
        slots.push({ el: slot, angle: -n * STEP });
        faces.push(face);
      }

      var tl = gsap.timeline({ paused: true });

      /* Base pose and rotary geometry live on the one seekable timeline. No
         filter touches the drum hierarchy, so preserve-3D remains intact. */
      tl.set(groundEl, { backgroundColor: "#30176e" }, 0);
      tl.set(anchorEl, { color: "#fff" }, 0);
      tl.set(faces, { color: "#6983ff" }, 0);
      tl.set(ruleEl, { scaleX: 0, transformOrigin: "0% 50%", backgroundColor: "#0053b8" }, 0);
      tl.set(railLogo, { filter: "brightness(0) invert(1)" }, 0);
      tl.set(railUrl, { color: "#fff" }, 0);
      tl.set(stackEl, { x: 80 }, 0);
      tl.set(axisEl, { z: "-" + RADIUS }, 0);
      tl.set(cylEl, { rotationX: 0, transformOrigin: "50% 50%" }, 0);
      for (var i = 0; i < slots.length; i++) {
        tl.set(slots[i].el, { rotationX: slots[i].angle, transformOrigin: "50% 50%" }, 0);
        tl.set(faces[i], { yPercent: -50, z: RADIUS }, 0);
      }

      /* Binary first reveal at 1.20s; every phase is doubled with the frame. */
      tl.set(drumEl, { opacity: 1 }, 1.20);
      tl.fromTo(ruleEl, { scaleX: 0 },
        { scaleX: 1, duration: 0.40, ease: "expo.out", immediateRender: false }, 1.20);

      /* Seven quick rotary jumps preserve the 5.3s slot while adding a full
         quarter-second composed pause before every next use case. */
      var ROLL_DUR = 0.11;
      var ROLL_START = 1.45;
      var ROLL_GAP = 0.36;              // 0.11s jump + 0.25s hold
      for (var r = 1; r < FEATURES.length; r++) {
        var rollAt = ROLL_START + (r - 1) * ROLL_GAP;
        var flipAt = rollAt + ROLL_DUR / 2;
        var blueState = r % 2 === 1;

        tl.to(cylEl, {
          rotationX: r * STEP,
          duration: ROLL_DUR,
          ease: "power3.inOut"
        }, rollAt);
        tl.set(groundEl, { backgroundColor: blueState ? "#6983ff" : "#30176e" }, flipAt);
        tl.set(anchorEl, { color: "#fff" }, flipAt);
        tl.set(faces, { color: blueState ? "#fff" : "#6983ff" }, flipAt);
        tl.set(ruleEl, { backgroundColor: "#0053b8" }, flipAt);
        tl.set(railLogo, { filter: "brightness(0) invert(1)" }, flipAt);
        tl.set(railUrl, { color: "#fff" }, flipAt);
      }

      /* ── Scene 3 (4.0–5.3s) — doubled three-phase nudge settle + hold ──────
         The final GEOSPATIAL. face settles near 3.72s. The group repositions
         over 0.56s, then holds its final state for the slower host exit. */
      var NT = 4.00;
      tl.fromTo(stackEl, { x: 80 },
        { x: 72, duration: 0.112, ease: "power3.in", immediateRender: false }, NT);
      tl.fromTo(stackEl, { x: 72 },
        { x: 20, duration: 0.100, ease: "none", immediateRender: false }, NT + 0.112);
      tl.fromTo(stackEl, { x: 20 },
        { x: 0, duration: 0.348, ease: "power4.out", immediateRender: false }, NT + 0.212);

      tl.seek(0);
      window.__timelines["03-capability"] = tl;
    })();
  </script>
</template>
