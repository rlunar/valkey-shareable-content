    (function () {
      "use strict";

      var DURATION = 2.6;
      var F = 1 / 30;

      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.00–0.90s) · multi-phase-camera ─────────────────────────
         One intentful establishing push under the plate — the "steady push"
         phase pattern (neutral -> push) collapsed to establish-only, because the
         storyboard forbids a back-half re-push. GSAP owns #f1-camera's whole
         transform and is its ONLY writer; the drift is folded in as x/y on the
         same element rather than a sine onUpdate, because a render seek can pass
         suppressEvents and silently kill a callback writer. X runs over the full
         duration and Y over the push window, so the two axes advance at
         different rates — the organic path the rule's DRIFT_FREQ_RATIO buys —
         and both are monotonic leans, never a breath (FRAME.md bans idle wobble). */
      var PHASE_1_SCALE = 1.02;
      var PHASE_2_SCALE = 1.088;
      var PHASE_2_DUR = 2.0;
      /* X leans LEFT — the film's current — so the camera is already travelling
         the way the 3.1s cut will travel. Y is neutral (down); UP is a reserved
         vector spent later in the film and must not be pre-echoed here. */
      var DRIFT_AMP_X = -3.2;
      var DRIFT_AMP_Y = 1.6;

      tl.fromTo("#f1-camera",
        { scale: PHASE_1_SCALE, y: 0 },
        { scale: PHASE_2_SCALE, y: DRIFT_AMP_Y, duration: PHASE_2_DUR, ease: "power3.out" }, 0);
      tl.fromTo("#f1-camera",
        { x: 0 },
        { x: DRIFT_AMP_X, duration: DURATION, ease: "power3.out" }, 0);

      /* ── Scene 2 (0.90–1.70s) · depth-of-field-blur, mechanic 1 (focal pull) ─
         The plate is the only off-focus plane; the type plane stays at --dof:0
         and sits above it in z. 10px is FRAME.md's text-scale blur ceiling — the
         opacity DIM does most of the push-back work, as the rule prescribes. */

      var BLUR_PX = 10;
      var DIM_LEVEL = 0.62;
      var FOCUS_DUR = 0.80;

      tl.fromTo("#f1-plate",
        { "--dof": "0px" },
        { "--dof": BLUR_PX + "px", duration: FOCUS_DUR, ease: "power3.out" }, CUE_TYPE);
      tl.fromTo("#f1-plate",
        { opacity: 1 },
        { opacity: DIM_LEVEL, duration: FOCUS_DUR, ease: "power3.out" }, CUE_TYPE);
      /* The type well deepens on the same window — "the world recedes" and "the
         type takes the focal plane" read as one move. */
      tl.fromTo("#f1-vignette",
        { opacity: 0.62 },
        { opacity: 1, duration: FOCUS_DUR, ease: "power3.out" }, CUE_TYPE);

      /* ── Scene 2 (0.90–1.41s) · waterfall-entry ────────────────────────────
         FAST. then RELIABLE. from below, one direction. Opacity is BINARY via
         tl.set — never a fade on an arrival. y offset and settle duration vary
         by weight (anchors travel further and longer, punctuation snaps), and
         the gap between starts SHRINKS across the cascade: 0.257 → 0.087 →
         0.060s, so the second phrase snaps tighter than the first. */

        { sel: "#f1-w-fast", y: 78, dur: 0.19, lead: 0, ease: "power4.out" },
        { sel: "#f1-w-dot1", y: 46, dur: 0.12, lead: -2, ease: "power4.out" },

        { sel: "#f1-w-dot2", y: 40, dur: 0.11, lead: 3, ease: "expo.out" }
      ];

      var at = CUE_TYPE;
      for (var i = 0; i < CASCADE.length; i += 1) {

        if (i > 0) {

        tl.fromTo(step.sel, { y: step.y }, { y: 0, duration: step.dur, ease: step.ease }, at);
