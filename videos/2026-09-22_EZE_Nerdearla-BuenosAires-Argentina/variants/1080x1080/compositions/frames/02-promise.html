  <script>
    (function () {
      "use strict";

      window.__timelines = window.__timelines || {};

      var FRAME_ID = "02-promise";
      var SCENE_DURATION = 2.4;

      var scope = document.querySelector('[data-composition-id="' + FRAME_ID + '"]') || document;

      /* ── Scene 2 (0.70–1.28s) · phrase-and-logo waterfall ────────────────
         Keep the original Backed/by cadence, then land the official logo at
         the former Linux word's start. The mask preserves binary visibility
         and the existing waterfall direction without touching the seam carrier. */
      var WORD_RISE = 0.3;
      var SUB_TIMELINE = [
        { label: "Backed", start: 0.7, end: 1.0 },
        { label: "by", start: 0.835, end: 1.135 },
        { label: "The Linux Foundation logo", start: 0.983502, end: 1.283502 }
      ];

      /* ── Scene 3 (1.50–2.20s) · keyword glow on FOREVER. ─────────────────
         asr-keyword-glow, default (non-karaoke) style: ONE linear driver
         sweeps scene time and one attack → sustain → release envelope fires
         once, decaying to a rest level it then holds. No loop, no pulse. */
      var ATTACK_DUR = 0.18;
      var RELEASE = 0.42;
      var REST_LEVEL = 0.22;
      var MAX_BLUR = 24;
      var MAX_GLOW_ALPHA = 0.5;
      var MAX_SCALE_BOOST = 0.035;

      var TIMINGS = { forever: { start: 1.5, end: 1.78 } };

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      var wordInners = Array.prototype.slice.call(scope.querySelectorAll(".f2-word-in"));
      var glowWords = Array.prototype.slice.call(scope.querySelectorAll("[data-word]"));

      var driver = { t: 0 };

      function applyGlow() {
        for (var i = 0; i < glowWords.length; i++) {
          var el = glowWords[i];
          var timing = TIMINGS[el.getAttribute("data-word")];
          if (!timing) continue;
          var env = envelope(driver.t, timing.start, timing.end);
          el.style.textShadow =
            "0 0 " + (MAX_BLUR * env).toFixed(2) + "px rgba(255, 255, 255, " + (MAX_GLOW_ALPHA * env).toFixed(3) + ")";
          el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(4) + ")";
        }
      }

          { yPercent: 0, duration: WORD_RISE, ease: "power4.out" },
          entry.start

      });

          duration: SCENE_DURATION,
          ease: "none",
          onUpdate: applyGlow
