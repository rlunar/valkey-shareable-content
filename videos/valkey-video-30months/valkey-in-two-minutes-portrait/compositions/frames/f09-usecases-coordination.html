  <script>
    (() => {
      const ID = "f09-usecases-coordination";
      const F = 1 / 30; // one frame at the project's 30 fps
      const PERI = "#6983FF";
      const DEEP = "#30176E";
      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.5s): title lands with the frame.md entrance token.
      tl.fromTo("#f09-usecases-coordination-title", { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);

      // waterfall-entry (adapted to land by 0.3s): five cells whip in from below as one accelerating cascade.
      // Opacity is binary, never a fade: a one-frame step from an explicit from-state (opacity 0) that completes
      // exactly on the arrival frame, so a cell first appears at its full y offset and reverts cleanly on a
      // backward seek. Starts are frame-aligned one frame apart; the anchor travels furthest and longest, each
      // later cell travels less and settles sooner, and the last one snaps. Timing and cell positions are
      // identical to Frame 8 so the two frames read as a cut, not a rebuild.
      const arrive = (sel, frame, offset, dur) => {
        const at = frame * F;
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, at - F);
        tl.fromTo(sel, { y: offset }, { y: 0, duration: dur, ease: "power4.out" }, at);
      };
      arrive("#f09-usecases-coordination-c1", 1, 72, 0.18); // anchor: visible 0.033, settles 0.213
      arrive("#f09-usecases-coordination-c2", 2, 60, 0.16); // visible 0.067, settles 0.227
      arrive("#f09-usecases-coordination-c3", 3, 48, 0.15); // visible 0.100, settles 0.250
      arrive("#f09-usecases-coordination-c4", 4, 40, 0.13); // visible 0.133, settles 0.263
      arrive("#f09-usecases-coordination-c5", 5, 30, 0.12); // visible 0.167, settles 0.287 (last one snaps; row 3 stays clear of the caption band)

      // The layer marker fades in at 0.5s.
      tl.fromTo("#f09-usecases-coordination-marker", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.5);

      // Scene 2 (0.5-5.0s): hold. On each voice cue the matching label tints periwinkle, holds, and is back at
      // deep purple 0.6s after the cue. Labels never swap; nothing is drawn behind the grid.
      // (immediateRender: false keeps each leg's from-state from pre-rendering over the resting colour.)
      const tint = (sel, at) => {
        tl.fromTo(sel, { color: DEEP }, { color: PERI, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(sel, { color: PERI }, { color: DEEP, duration: 0.18, ease: "power2.inOut", immediateRender: false }, at + 0.42);
      };
      tint("#f09-usecases-coordination-l5", 0.4); // "Coordinate services"
      tint("#f09-usecases-coordination-l4", 2.3); // "retries"

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
