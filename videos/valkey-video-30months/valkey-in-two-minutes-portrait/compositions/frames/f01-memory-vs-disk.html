  <script>
    (() => {
      const P = "f01-memory-vs-disk";
      const el = (name) => document.getElementById(P + "-" + name);
      const sel = (name) => "#" + P + "-" + name;
      const tl = gsap.timeline({ paused: true });

      // frame.md entrance token: fromTo, y 32 -> 0 + opacity 0 -> 1, 0.55s, power3.out
      const enter = (target, at, y = 32, duration = 0.55) => {
        tl.fromTo(target, { y: y, opacity: 0 }, { y: 0, opacity: 1, duration: duration, ease: "power3.out" }, at);
      };

      // svg-path-draw setup: measured length, dash pushed fully out of view.
      // The gap is padded past the length so a round cap never leaks a dot at the path start.
      const prepDraw = (path, extra) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len + " " + (len + extra * 2);
        path.style.strokeDashoffset = String(len + extra);
      };
      const pathRam = el("path-ram");
      const pathDisk = el("path-disk");
      const outline = el("outline");
      const arrowReveal = el("arrow-reveal");
      prepDraw(pathRam, 6);
      prepDraw(pathDisk, 6);
      prepDraw(outline, 2);
      prepDraw(arrowReveal, 30);

      // Pulses ride their own path: position is a pure function of the proxy progress (seek-safe).
      const ramLen = pathRam.getTotalLength();
      const diskLen = pathDisk.getTotalLength();
      const pulseRam = el("pulse-ram");
      const pulseDisk = el("pulse-disk");
      const place = (dot, path, len, p) => {
        const pt = path.getPointAtLength(len * p);
        dot.setAttribute("cx", pt.x.toFixed(2));
        dot.setAttribute("cy", pt.y.toFixed(2));
      };
      const ramProg = { p: 0 };
      const diskProg = { p: 0 };
      place(pulseRam, pathRam, ramLen, 0);
      place(pulseDisk, pathDisk, diskLen, 0);

      // ---- Scene 1 (0.0-2.4s): title, processor, two hairline paths draw downward, endpoints enter
      enter(sel("title"), 0.1);
      enter(sel("node"), 0.3);
      tl.to(pathRam, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.7);
      enter(sel("glyph-ram"), 1.1);
      enter(sel("endlabel-ram"), 1.2);
      tl.to(pathDisk, { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, 1.25);
      enter(sel("glyph-disk"), 1.7);
      enter(sel("endlabel-disk"), 1.8);

      // ---- Scene 2 (2.4-3.6s): pulses leave together; RAM lands at 3.3 and its path lights periwinkle
      tl.fromTo([pulseRam, pulseDisk], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 2.4);
      tl.to(ramProg, { p: 1, duration: 0.9, ease: "power1.out", onUpdate: () => place(pulseRam, pathRam, ramLen, ramProg.p) }, 2.4);
      tl.to(diskProg, { p: 1, duration: 2.8, ease: "power1.out", onUpdate: () => place(pulseDisk, pathDisk, diskLen, diskProg.p) }, 2.4);
      enter(sel("caption-concept"), 3.0, 24, 0.5);
      tl.to(pathRam, { stroke: "#6983FF", strokeWidth: 5, duration: 0.3, ease: "power2.inOut" }, 3.3);
      tl.to(pulseDisk, { fill: "#596672", duration: 0.3, ease: "power2.inOut" }, 3.3);

      // ---- Scene 3 (3.6-5.6s): periwinkle outline wraps the RAM working set; "working data" tints
      tl.to(outline, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.6);
      tl.to(sel("ram-emph"), { color: "#6983FF", duration: 0.3, ease: "power2.inOut" }, 4.1);
      // disk pulse arrives at 5.2s inside its own tween, no colour change

      // ---- Scene 4 (5.6-8.0s): dashed grey arrow draws from the RAM outline across to the disk endpoint, labelled
      tl.to(arrowReveal, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 5.8);
      enter(sel("caption-persist"), 6.55, 24, 0.5);

      // hold composed to the frame's full 8s
      const hold = { v: 0 };
      tl.set(hold, { v: 1 }, 8);

      window.__timelines = window.__timelines || {};
      window.__timelines[P] = tl;
    })();
  </script>
