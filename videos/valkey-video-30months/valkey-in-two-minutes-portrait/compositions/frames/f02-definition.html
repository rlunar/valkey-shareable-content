  <script>
    (() => {
      const P = "f02-definition";
      const sel = (name) => "#" + P + "-" + name;
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30; // one frame at the project's 30 fps

      // ---- Scene 1 (0.0-4.0s): phrase 1 enters with the frame.md entrance token; hero zone stays empty
      tl.fromTo(sel("p1"), { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.45);

      // ---- Scene 2 (4.0-8.2s): hard token swap in place (kinetic-type-beats) - binary, no crossfade
      tl.set(sel("p1"), { opacity: 0 }, 4.0);
      tl.set(sel("p2"), { opacity: 1 }, 4.0);

      // ---- Scene 3 (8.2-13.4s): workloads line; each word tints periwinkle on its voice cue, separators stay deep purple
      tl.set(sel("p2"), { opacity: 0 }, 8.2);
      tl.set(sel("p3"), { opacity: 1 }, 8.2);
      tl.to(sel("w-caching"), { color: "#6983FF", duration: 0.3, ease: "power2.inOut" }, 8.4);
      tl.to(sel("w-queues"), { color: "#6983FF", duration: 0.3, ease: "power2.inOut" }, 9.3);
      tl.to(sel("w-primary"), { color: "#6983FF", duration: 0.3, ease: "power2.inOut" }, 11.3);

      // ---- Scene 4 (13.4-17.8s): Linux Foundation line; the LF mark fades in beneath on "Linux"
      tl.set(sel("p3"), { opacity: 0 }, 13.4);
      tl.set(sel("p4"), { opacity: 1 }, 13.4);
      tl.fromTo(sel("lf"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 14.5);

      // ---- Scene 5 (17.8-20.0s): phrase + mark fall away, closing statement arrives by waterfall-entry
      tl.to([sel("p4"), sel("lf")], { opacity: 0, duration: 0.25, ease: "power1.in" }, 17.8);

      // waterfall-entry: binary reveal via tl.set, whip from below on power4.out, overlapping starts,
      // weight-scaled travel; the final word is split into two fragments to extend the climax
      const cascade = (id, at, travel, dur) => {
        tl.set(id, { opacity: 1, y: travel }, at);
        tl.to(id, { y: 0, duration: dur, ease: "power4.out" }, at);
      };
      const t0 = 18.0;                           // anchor word, heaviest: biggest travel, longest settle
      cascade(sel("hw-open"), t0, 80, 0.18);
      const t1 = t0 + 0.18 + F;                  // one frame after the anchor settles
      cascade(sel("hw-source"), t1, 45, 0.15);
      const t2 = t1 + 0.15 - F;                  // one frame BEFORE the previous settles (overlap)
      cascade(sel("hw-for"), t2, 70, 0.16);
      const t3 = t2 + 0.16 - F;
      cascade(sel("hw-ever"), t3, 70, 0.15);     // lands at ~18.61s

      tl.fromTo(sel("attrib"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 18.8);

      // hold composed to the frame's full 20s
      const hold = { v: 0 };
      tl.set(hold, { v: 1 }, 20);

      window.__timelines = window.__timelines || {};
      window.__timelines[P] = tl;
    })();
