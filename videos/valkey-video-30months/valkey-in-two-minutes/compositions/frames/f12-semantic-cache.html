  <script>
    (() => {
      const ID = "f12-semantic-cache";
      const S = (name) => "#" + ID + "-" + name;
      const el = (name) => document.querySelector(S(name));

      const PERI = "#6983FF", EXPENSIVE = "#642637", SECONDARY = "#596672";
      const TINT = "#F1EFFD", PAPER = "#FFFDFA", NODE_BORDER = "#BCB5E7", HAIRLINE = "#D3DDE7";
      const ENTER = { duration: 0.55, ease: "power3.out" };
      const SWAP = { duration: 0.3, ease: "power2.inOut" };
      const DRAW_EASE = "power2.out";

      // ---- svg-path-draw setup: measure every path once at build time ----
      // getTotalLength() is the source of truth; if the element is not rendered yet, fall
      // back to the same geometry integrated numerically from the path data (never a guess).
      const numbers = (d) => (d.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
      const cubicLength = (n) => {
        let len = 0, px = n[0], py = n[1];
        for (let i = 1; i <= 96; i++) {
          const t = i / 96, u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
          const x = a * n[0] + b * n[2] + c * n[4] + d * n[6];
          const y = a * n[1] + b * n[3] + c * n[5] + d * n[7];
          len += Math.hypot(x - px, y - py); px = x; py = y;
        }
        return len;
      };
      const fallbackLength = (path) => {
        const d = path.getAttribute("d") || "", n = numbers(d);
        if (/C/.test(d) && n.length >= 8) return cubicLength(n);
        if (/h/.test(d) && n.length >= 4) return 2 * (Math.abs(n[2]) + Math.abs(n[3]));
        return 0;
      };
      const measure = (path) => {
        let len = 0;
        try { len = path.getTotalLength(); } catch (e) { len = 0; }
        if (!(len > 0)) len = fallbackLength(path);
        return len * 1.02; // slight overestimate: too large is invisible at start, too small clips the end
      };
      const prime = (path) => {
        const len = measure(path);
        // gap longer than the dash and a 12px start margin: with round caps a dash ending exactly at
        // the path start would otherwise peek through as a dot before the flow is drawn
        path.style.strokeDasharray = `${len} ${len + 24}`;
        path.style.strokeDashoffset = `${len + 12}`;
        return len;
      };

      // arrowheads sit at each flow's end point, aligned to the end tangent (c2 -> end)
      const heads = el("heads");
      const makeHead = (path, color) => {
        const n = numbers(path.getAttribute("d"));
        const ex = n[6], ey = n[7], ang = Math.atan2(ey - n[5], ex - n[4]) * 180 / Math.PI;
        const head = document.createElementNS("http://www.w3.org/2000/svg", "path");
        head.setAttribute("d", "M 1 0 L -20 -9.5 L -20 9.5 Z");
        head.setAttribute("fill", color);
        head.setAttribute("transform", `translate(${ex} ${ey}) rotate(${ang.toFixed(3)})`);
        head.setAttribute("class", ID + "-head");
        heads.appendChild(head);
        return head;
      };

      const flowIds = ["embed", "knn", "validate", "hit", "miss", "store"];
      const flows = {};
      flowIds.forEach((k) => {
        const path = el("flow-" + k);
        flows[k] = { path, head: makeHead(path, k === "miss" ? EXPENSIVE : PERI) };
        prime(path);
      });
      const maskEmbed = el("maskpath-embed"), maskModel = el("maskpath-model");
      prime(maskEmbed); prime(maskModel);

      // ---- one paused timeline ----
      const tl = gsap.timeline({ paused: true });

      // step_bar copy is swapped by a time driver (seek-safe, deterministic)
      const STEPS = [
        { t: 0.0,  label: "READY",        detail: "Cache by meaning, not by the exact string." },
        { t: 1.2,  label: "1 · EMBED",    detail: "Convert the prompt into a vector." },
        { t: 2.4,  label: "2 · SEARCH",   detail: "Find the nearest cached vectors in scope." },
        { t: 5.6,  label: "3 · VALIDATE", detail: "Three checks on the nearest match." },
        { t: 7.3,  label: "3 · HIT",      detail: "Reuse the cached answer." },
        { t: 8.6,  label: "4 · MISS",     detail: "No safe match: call the model once." },
        { t: 11.6, label: "5 · STORE",    detail: "Save the embedding and answer with an expiry." },
      ];
      const stepRow = el("step-row"), stepLabel = el("step-label"), stepDetail = el("step-detail");
      const driver = { t: 0 };
      let shownStep = -1;
      tl.to(driver, {
        t: 17, duration: 17, ease: "none",
        onUpdate: () => {
          let i = STEPS.length - 1;
          while (i > 0 && driver.t < STEPS[i].t) i--;
          if (i !== shownStep) {
            shownStep = i;
            stepLabel.textContent = STEPS[i].label;
            stepDetail.textContent = STEPS[i].detail;
          }
          // current_swap: 0.3s settle of the fresh copy (first state rides the bar's own entrance)
          const k = i === 0 ? 1 : Math.min(1, Math.max(0, (driver.t - STEPS[i].t) / 0.3));
          const e = 1 - (1 - k) * (1 - k);
          stepRow.style.opacity = e.toFixed(3);
          stepRow.style.transform = `translateY(${((1 - e) * 8).toFixed(2)}px)`;
        },
      }, 0);

      // helpers
      const enter = (target, at, dy = 32, dur = ENTER.duration) =>
        tl.fromTo(target, { y: dy, opacity: 0 }, { y: 0, opacity: 1, duration: dur, ease: ENTER.ease }, at);
      const draw = (key, at, dur = 0.6) => {
        const f = flows[key];
        tl.to(f.path, { strokeDashoffset: 0, duration: dur, ease: DRAW_EASE }, at);
        tl.fromTo(f.head, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, at + dur - 0.14);
      };
      const restFlow = (key, at) => {
        const f = flows[key];
        tl.to(f.path, { opacity: 0.32, attr: { "stroke-width": 5 }, ...SWAP }, at);
        tl.to(f.head, { opacity: 0.32, ...SWAP }, at);
      };
      const showPill = (key, at) =>
        tl.fromTo(S("pill-" + key), { y: 6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, at);
      const restPill = (key, at) =>
        tl.to(S("pill-" + key), { opacity: 0.48, borderColor: HAIRLINE, color: SECONDARY, ...SWAP }, at);
      const current = (key, at) => {
        tl.to(S("card-" + key), { borderColor: PERI, backgroundColor: TINT, y: -6, ...SWAP }, at);
        tl.to(S("card-" + key) + " .f12-semantic-cache-shadow", { opacity: 1, ...SWAP }, at);
      };
      const rest = (key, at) => {
        tl.to(S("card-" + key), { borderColor: NODE_BORDER, backgroundColor: PAPER, y: 0, ...SWAP }, at);
        tl.to(S("card-" + key) + " .f12-semantic-cache-shadow", { opacity: 0, ...SWAP }, at);
      };
      const tick = (n, at, color) => tl.to(S("gate-" + n), { color, ...SWAP }, at);

      // ---- Scene 1 (0.0–1.2): title, cards, dashed boundary, READY ----
      enter(S("title"), 0.0);
      ["prompt", "embed", "search", "valid", "model"].forEach((k, i) => enter(S("card-" + k), 0.05 + i * 0.1));
      enter(S("step"), 0.2);
      tl.to(maskEmbed, { strokeDashoffset: 0, duration: 0.55, ease: DRAW_EASE }, 0.35);
      tl.to(maskModel, { strokeDashoffset: 0, duration: 0.55, ease: DRAW_EASE }, 0.75);
      enter(S("note-embed"), 0.8, 8, 0.4);
      enter(S("note-model"), 1.2, 8, 0.4);

      // ---- Scene 2 (1.2–2.4): 1 · EMBED ----
      current("prompt", 1.2);
      draw("embed", 1.25);
      showPill("embed", 1.55);

      // ---- Scene 3 (2.4–5.6): 2 · SEARCH ----
      restFlow("embed", 2.45);
      restPill("embed", 2.45);
      draw("knn", 2.45);
      showPill("knn", 2.75);
      rest("prompt", 2.9);
      current("search", 2.9);
      // the point cloud: scope ring, eight grey neighbours, the Paris dot nearest the centre
      tl.fromTo(S("ring"), { scale: 0.6, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 3.0);
      tl.fromTo(S("cloud") + " .f12-semantic-cache-dot:not(#f12-semantic-cache-dot-new)",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.04 }, 3.05);
      tl.fromTo(S("dot-paris"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 3.35);
      enter(S("caption"), 3.1, 8, 0.4);

      // ---- Scene 4 (5.6–8.6): 3 · VALIDATE → HIT ----
      restFlow("knn", 5.6);
      restPill("knn", 5.6);
      draw("validate", 5.6);
      rest("search", 6.15);
      current("valid", 6.15);
      tick(1, 5.7, PERI);
      tick(2, 6.3, PERI);
      tick(3, 6.9, PERI);
      restFlow("validate", 7.3);
      draw("hit", 7.3, 0.65);
      showPill("hit", 7.6);
      rest("valid", 7.9);
      current("prompt", 7.9);
      tl.fromTo(S("paris"), { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 7.9);

      // ---- Scene 5 (8.6–11.6): 4 · MISS — one check fails, the model is called once ----
      tick(2, 8.8, SECONDARY);
      restFlow("hit", 8.8);
      restPill("hit", 8.8);
      rest("prompt", 8.8);
      draw("miss", 8.8);
      showPill("miss", 9.1);
      current("model", 9.35);

      // ---- Scene 6 (11.6–14.0): 5 · STORE ----
      restFlow("miss", 11.6);
      restPill("miss", 11.6);
      draw("store", 11.6, 0.65);
      showPill("store", 11.9);
      rest("model", 12.2);
      current("search", 12.2);
      tl.fromTo(S("dot-new"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 12.4);

      // ---- Scene 7 (14.0–17.0): footnote, hold ----
      enter(S("footnote"), 14.0, 12, 0.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
