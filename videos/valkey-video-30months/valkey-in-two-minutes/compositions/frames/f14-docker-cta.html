<template>
  <style>

    @font-face { font-family: "Cascadia Code"; src: url("assets/fonts/CascadiaCode-Variable.woff2") format("woff2"); font-weight: 200 700; font-style: normal; }

    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Open Sans", sans-serif; color: #1A2026; }
    .clip { position: absolute; inset: 0; }

    /* ground — the film's one gradient, on its own clip */
    .f14-docker-cta-ground { background: linear-gradient(135deg, #FFFFFF 0%, #F7FBFE 62%, #F1EFFD 100%); }

    /* frame title */

      letter-spacing: 0.04em; text-transform: uppercase; color: #30176E;
    }

    /* terminal_card: a macOS Terminal window — title bar with traffic lights, light body — sized for the 36-char hero command at 76px */
    .f14-docker-cta-card {
      position: absolute; left: 100px; top: 380px; width: 1720px; height: 316px; box-sizing: border-box;
      background: #FFFFFF; border: 2px solid #D3DDE7; border-radius: 14px; box-shadow: 0 18px 48px rgba(48, 23, 110, 0.10); overflow: hidden;

    .f14-docker-cta-bar { position: absolute; left: 0; top: 0; width: 100%; height: 56px; background: #ECEFF4; border-bottom: 1px solid #D3DDE7; }
    .f14-docker-cta-dot { position: absolute; top: 20px; width: 16px; height: 16px; border-radius: 50%; }
    .f14-docker-cta-dot-r { left: 22px; background: #FF5F57; }
    .f14-docker-cta-dot-y { left: 50px; background: #FEBC2E; }
    .f14-docker-cta-dot-g { left: 78px; background: #28C840; }
    .f14-docker-cta-bar-title { position: absolute; left: 0; top: 0; width: 100%; height: 56px; line-height: 56px; text-align: center; font-family: "Cascadia Code", monospace; font-size: 22px; font-weight: 500; color: #596672; }
    .f14-docker-cta-body { position: absolute; left: 0; top: 57px; width: 100%; height: 257px; display: flex; align-items: center; padding-left: 56px; box-sizing: border-box; }
    .f14-docker-cta-cmd {
      display: inline-flex; align-items: baseline; min-width: 1604px; white-space: pre;

    .f14-docker-cta-caption {

    }

    /* secondary links — bottom-LEFT only, kept above the caption keep-out; bottom-right belongs to the master timeline */
    .f14-docker-cta-links {
      position: absolute; left: 96px; top: 858px; margin: 0;

  <div data-hf-id="hf-6pqm" id="root" data-composition-id="f14-docker-cta" data-width="1920" data-height="1080">
    <div data-hf-id="hf-u6f3" id="f14-docker-cta-layer-1" class="clip f14-docker-cta-ground" data-start="0" data-duration="8.5" data-track-index="0"></div>
    <div data-hf-id="hf-7vvu" id="f14-docker-cta-layer-2" class="clip f14-docker-cta-stage" data-start="0" data-duration="8.5" data-track-index="1">

      <h2 data-hf-id="hf-uaig" id="f14-docker-cta-title" class="f14-docker-cta-title">Try Valkey</h2>

      <div data-hf-id="hf-u4tm" id="f14-docker-cta-card" class="f14-docker-cta-card">
        <div data-hf-id="hf-9g0j" class="f14-docker-cta-bar"><span data-hf-id="hf-3wu4" class="f14-docker-cta-dot f14-docker-cta-dot-r"></span><span data-hf-id="hf-ncq7" class="f14-docker-cta-dot f14-docker-cta-dot-y"></span><span data-hf-id="hf-0mwh" class="f14-docker-cta-dot f14-docker-cta-dot-g"></span><span data-hf-id="hf-dfeu" class="f14-docker-cta-bar-title">Terminal — zsh</span></div>
        <div data-hf-id="hf-mzs8" class="f14-docker-cta-body">
          <div data-hf-id="hf-gslw" class="f14-docker-cta-cmd"><span data-hf-id="hf-zzkw" id="f14-docker-cta-cmd-base"></span><span data-hf-id="hf-pxqv" id="f14-docker-cta-cmd-image" class="f14-docker-cta-cmd-image"></span><span data-hf-id="hf-kh2f" id="f14-docker-cta-cursor" class="f14-docker-cta-cursor"></span></div>
        </div>
      </div>

      <p data-hf-id="hf-p5np" id="f14-docker-cta-caption" class="f14-docker-cta-caption">Core server · Docker required</p>
      <p data-hf-id="hf-lbh4" id="f14-docker-cta-links" class="f14-docker-cta-links">valkey.io · github.com/valkey-io</p>
    </div>
  </div>

  <script>
    (() => {
      const ID = "f14-docker-cta";
      const S = (name) => "#" + ID + "-" + name;
      const DURATION = 8.5;

      // The command is exact and final: typed by 1.0s, then never changes.
      const COMMAND = "docker run --rm valkey/valkey:alpine";
      const BASE_LEN = "docker run --rm ".length; // 16 chars in ink, then valkey/valkey:alpine in periwinkle

      // discrete-text-sequence: keystroke clusters, then bulk completions — every state is a true prefix
      const SEQUENCE = [
        { t: 0.00, n: 0 },
        { t: 0.30, n: 1 },   // d
        { t: 0.38, n: 2 },   // do
        { t: 0.46, n: 3 },   // doc
        { t: 0.54, n: 4 },   // dock
        { t: 0.60, n: 6 },   // docker
        { t: 0.68, n: 8 },   // docker r
        { t: 0.74, n: 10 },  // docker run
        { t: 0.80, n: 15 },  // docker run --rm
        { t: 0.88, n: 23 },  // docker run --rm valkey/
        { t: 0.94, n: 30 },  // docker run --rm valkey/valkey:
        { t: 1.00, n: 36 },  // docker run --rm valkey/valkey:alpine
      ];
      const charsAt = (time) => {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) if (time >= SEQUENCE[i].t) return SEQUENCE[i].n;
        return 0;
      };

      const baseEl = document.querySelector(S("cmd-base"));
      const imageEl = document.querySelector(S("cmd-image"));
      const cursorEl = document.querySelector(S("cursor"));

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.0): title and the empty card enter, the command types in
      tl.fromTo(S("title"), { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.0);
      tl.fromTo(S("card"), { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);

      // one time driver spanning the whole frame: text state + cursor are pure functions of time (seek-safe)
      const driver = { t: 0 };
      let shown = -1;
      tl.to(driver, {
        t: DURATION, duration: DURATION, ease: "none",
        onUpdate: () => {
          const n = charsAt(driver.t);
          if (n !== shown) {
            shown = n;
            const s = COMMAND.slice(0, n);
            baseEl.textContent = s.slice(0, BASE_LEN);
            imageEl.textContent = s.slice(BASE_LEN);
          }
          // cursor: solid while typing, a deterministic sin square-wave blink after completion, gone once the caption lands
          let visible = 1;
          if (driver.t >= 1.0) visible = driver.t < 3.2 && Math.sin((driver.t - 1.0) * (Math.PI * 2 / 0.6)) >= 0 ? 1 : 0;
          cursorEl.style.opacity = String(visible);
        },
      }, 0);

      // Scene 2 (1.0–8.5): the command holds; caption at 3.2s, links bottom-left at 5.0s; quiet settle, no exit
      tl.fromTo(S("caption"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.2);
      tl.fromTo(S("links"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.0);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
