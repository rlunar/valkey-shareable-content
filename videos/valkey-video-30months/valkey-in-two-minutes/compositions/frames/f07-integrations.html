  <script>
    (() => {
      const ID = "f07-integrations";
      const tl = gsap.timeline({ paused: true });

      // entrance token: fromTo, y 32 -> 0 + opacity 0 -> 1, 0.55s, power3.out
      const enter = (sel, at) =>
        tl.fromTo(sel, { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, at);

      // svg-path-draw: measure the path, make it one dash, tween the offset to 0.
      // `fallback` is the path's geometric length, used only if the SVG is not measurable yet.
      const draw = (sel, at, dur, fallback) => {
        const p = document.querySelector(sel);
        if (!p) return;
        const len = (p.getTotalLength() || fallback) * 1.02;
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
        tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      };

      // Scene 1 (0.0-1.0s): title, the three app cards, the empty band, the Valkey card (0.1s stagger)
      enter("#f07-title", 0.0);
      enter("#f07-node-app", 0.1);
      enter("#f07-node-service", 0.2);
      enter("#f07-node-function", 0.3);
      enter("#f07-band", 0.4);
      enter("#f07-node-valkey", 0.5);

      // Scene 2 (1.0-4.6s): "Valkey GLIDE" lands on its cue; connectors draw in periwinkle.
      // The three app->band flows fan in as one 0.5s draw; the band->Valkey flow starts at
      // ~75% of the last one so the signal reads as a continuous trace through the band.
      enter("#f07-glide", 1.0);
      draw("#f07-flow-1", 1.00, 0.5, 291); draw("#f07-head-1", 1.42, 0.15, 38);
      draw("#f07-flow-2", 1.08, 0.5, 290); draw("#f07-head-2", 1.50, 0.15, 38);
      draw("#f07-flow-3", 1.16, 0.5, 291); draw("#f07-head-3", 1.58, 0.15, 38);
      draw("#f07-flow-4", 1.54, 0.4, 270); draw("#f07-head-4", 1.86, 0.12, 38);
      // drawn flows settle to the resting opacity so periwinkle stays on one thing at a time
      tl.fromTo("#f07-flows", { opacity: 1 }, { opacity: 0.32, duration: 0.35, ease: "power1.out" }, 2.05);

      // the remaining integrations land on their voice cues
      enter("#f07-spring", 1.9);
      enter("#f07-fastify", 2.8);
      enter("#f07-powertools", 4.1);

      // Scene 3 (4.6-6.5s): hold; the Valkey card takes the current state (current_swap: 0.3s, power2.inOut)
      const SWAP = { duration: 0.3, ease: "power2.inOut" };
      tl.to("#f07-node-valkey", { y: -6, ...SWAP }, 4.8);
      tl.fromTo("#f07-valkey-box", { borderColor: "#BCB5E7", backgroundColor: "#FFFDFA" }, { borderColor: "#6983FF", backgroundColor: "#F1EFFD", ...SWAP }, 4.8);
      tl.fromTo("#f07-valkey-shadow-rest", { opacity: 1 }, { opacity: 0, ...SWAP }, 4.8);
      tl.fromTo("#f07-valkey-shadow-current", { opacity: 0 }, { opacity: 1, ...SWAP }, 4.8);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
