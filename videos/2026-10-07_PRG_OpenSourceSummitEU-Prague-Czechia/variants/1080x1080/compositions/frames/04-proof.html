  <script>
    (function () {
      "use strict";
      window.__timelines = window.__timelines || {};

      var FPS = 30;
      var DUR = 2.6;

      // at(n)  exact frame time — used to schedule tweens on the frame grid.
      // th(n)  half-frame-early threshold — a discrete state authored for frame n
      //        lands ON frame n regardless of float rounding in the seek.
      function at(n) { return n / FPS; }
      function th(n) { return (n - 0.5) / FPS; }

      // Source-verified, verbatim (incl. --rm). Every state is a prefix of this
      // one string, so the line can never drift from the source.
      var CMD = "docker run --rm valkey/valkey:9.1.2";
      var CARET = "#0053b8";                       // action-blue

      // discrete-text-sequence: sparse {t, text} states, reverse-searched each
      // frame. Realism comes from the schedule shape — keystroke clusters with
      // two-frame holds at every word break, then "9.1.2" pasted as one unit.
      // Single segment (context-sensitive-cursor): the brand rations action-blue
      // to one atom per frame, so the caret colour is carried on the entry but
      // never changes value.
      var STROKES = [
        [31, 2], [32, 3], [33, 4], [34, 5], [35, 6],            // docker
        [37, 7], [38, 8], [39, 9], [40, 10],                    // ' run'
        [42, 11], [43, 12], [44, 13], [45, 14], [46, 15],       // ' --rm'
        [48, 16], [49, 19], [50, 22], [51, 24], [52, 29],       // ' valkey/valkey'
        [53, 30],                                               // ':'
        [55, 35]                                                // '9.1.2' lands whole
      ];

      var SEQUENCE = [{ t: 0, text: "", color: CARET }];
      for (var s = 0; s < STROKES.length; s++) {
        SEQUENCE.push({ t: th(STROKES[s][0]), text: CMD.slice(0, STROKES[s][1]), color: CARET });
      }

      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      var T_CARET_ON = th(30);      // caret arrives as the card surface finishes settling
      var T_TYPE_IN = th(31);       // first keystroke
      var T_TYPE_OUT = th(55);      // last keystroke — 9.1.2
      var BLINK_CYCLES = 2;         // whole number over the typing window

      // Finite deterministic blink: a pure function of the driver's time over the
      // typing window only — no repeat, no yoyo, no CSS animation, no mutable
      // tracker (so it is identical at any seek, either direction). cos() is used
      // instead of sin() so the wave both STARTS and ENDS on-state: the caret is
      // solid the instant 9.1.2 lands and stays solid through the dead-still beat.
      function caretOpacityAt(time) {
        if (time < T_CARET_ON) return 0;           // card surface only
        if (time < T_TYPE_IN) return 1;            // solid, waiting to type
        if (time > T_TYPE_OUT) return 1;           // Scene 4 — at rest, dead still
        var u = (time - T_TYPE_IN) / (T_TYPE_OUT - T_TYPE_IN);
        return Math.cos(Math.PI * 2 * BLINK_CYCLES * u) >= 0 ? 1 : 0;
      }

      var textEl = document.getElementById("f4-cmd-text");
      var caretEl = document.getElementById("f4-caret");

      function apply(time) {
        var entry = stateAt(time);
        textEl.textContent = entry.text;
        caretEl.style.background = entry.color;
        caretEl.style.opacity = String(caretOpacityAt(time));
      }
      apply(0);

      var tl = gsap.timeline({ paused: true });

      // Scene 2 — the card-documentation surface lands, riding the film's LEFT
      // current so it reads as the same curve the version block arrived on.
      tl.fromTo("#f4-card",
        { x: 88, opacity: 0 },
        { x: 0, opacity: 1, duration: at(9), ease: "power3.out" },
        at(21));

      // Scene 3 — ONE linear driver owns every discrete state (text + caret).
      // ease "none" is the sequencer, not a motion ease.
      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () { apply(driver.t); }
      }, 0);

      // Scene 3 close — the release stamp settles UP into place, pre-echoing the
      // ledger's UP exit. Lands on frame 59; frame 60 onward is untouched.
      tl.fromTo("#f4-released",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: at(59) - at(53), ease: "power3.out" },
        at(53));

      tl.seek(0);
      window.__timelines["04-proof"] = tl;
    })();
