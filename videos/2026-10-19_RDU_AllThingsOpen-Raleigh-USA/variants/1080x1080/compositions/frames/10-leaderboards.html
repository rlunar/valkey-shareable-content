      /* The board arrives, then UI life is staged through the back half. */
      tl.fromTo("#f10-board", { x: 96, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, 0.30);

      var rowStarts = [0.52, 0.70, 0.88];
