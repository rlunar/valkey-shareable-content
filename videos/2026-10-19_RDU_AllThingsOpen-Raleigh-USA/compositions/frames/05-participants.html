    (function () {
      "use strict";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
         Waterfall ENTRY (waterfall-entry), not a seam.
         - reading order, one direction (from below)
         - opacity is BINARY 0 -> 1 via tl.set; never a fade on an arrival
         - Y offset + duration vary by logo WEIGHT (rendered optical mass in
           its cell): heavy marks travel further and settle longer, light
           wordmarks snap
         - inter-cell gaps shrink x0.84 so the cascade ACCELERATES and the
           last cell (Alibaba Cloud) snaps
         - every start time derives from element INDEX, so the cascade is
           fully deterministic and byte-identical on every render
         ------------------------------------------------------------------ */
      var CELLS = [
        /* row 1 */
        { el: "#f5-c01", y: 78, dur: 0.20 },  /* AWS — focal anchor, heaviest travel */
        { el: "#f5-c02", y: 48, dur: 0.15 },  /* Google Cloud */
        { el: "#f5-c03", y: 34, dur: 0.12 },  /* Oracle — light wordmark, snaps */

        { el: "#f5-c05", y: 46, dur: 0.14 },  /* ByteDance */
        { el: "#f5-c06", y: 52, dur: 0.15 },  /* Percona */
        /* row 2 */
        { el: "#f5-c07", y: 68, dur: 0.18 },  /* Aiven — heavy */
        { el: "#f5-c08", y: 46, dur: 0.14 },  /* DigitalOcean */
        { el: "#f5-c09", y: 74, dur: 0.19 },  /* Heroku — heaviest mass in the wall */
        { el: "#f5-c10", y: 64, dur: 0.17 },  /* Vultr */
        { el: "#f5-c11", y: 64, dur: 0.17 },  /* NetApp Instaclustr */
        { el: "#f5-c12", y: 66, dur: 0.18 },  /* UpCloud */
        /* row 3 */
        { el: "#f5-c13", y: 34, dur: 0.12 },  /* IONOS — light wordmark */
        { el: "#f5-c14", y: 44, dur: 0.14 },  /* Momento */
        { el: "#f5-c15", y: 70, dur: 0.18 },  /* anynines — heavy */
        { el: "#f5-c16", y: 44, dur: 0.13 },  /* Tencent Cloud */
        { el: "#f5-c17", y: 36, dur: 0.11 }   /* Alibaba Cloud — LAST cell, snaps */
      ];

      var CASCADE_START = 0.5;   /* first arrival lands inside the hero-visibility window */
      var FIRST_GAP = 0.201;     /* tuned so the wall is composed by ~1.83s */
      var GAP_RATIO = 0.84;      /* gaps SHRINK -> the cascade accelerates */

      /* Scene 1 (0.0-0.6s): white ground rides in on the seam's UP entry, the
         section title is already composed, the wall cells are empty. */
      var i, c, ids = [];
      for (i = 0; i < CELLS.length; i++) { ids.push(CELLS[i].el); }
      tl.set(ids, { opacity: 0 }, 0);
      tl.set("#f5-rule", { opacity: 0 }, 0);

      /* Scene 2 (0.6-1.8s): the cascade. */
      var t = CASCADE_START;
      var gap = FIRST_GAP;
      for (i = 0; i < CELLS.length; i++) {
        c = CELLS[i];
        tl.set(c.el, { opacity: 1 }, t);
        tl.fromTo(
          c.el,
          { y: c.y },
          { y: 0, duration: c.dur, ease: "power4.out", immediateRender: false },
          t
        );
        t += gap;
        gap *= GAP_RATIO;
      }

      /* Scene 3 (1.8-3.0s): the wall resolves, then the frame holds dead
         still through the added half-second before the host Z-pull transition. No
         exit tween here — the seam IS the exit. */

      tl.fromTo(
        "#f5-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.22, ease: "power3.out", immediateRender: false },
        1.88
      );

      /* Explicit final-state re-assert at 2.5s; the framework then holds that
         composed state through the frame's full 3.0s. The wall is DEAD STILL
         from 2.10s (no idle wobble, no float) before the host Z-pull transition.
         Never an exit tween: the seam IS the exit. */
      tl.set("#f5-rule", { opacity: 1, scaleX: 1 }, 2.5);

      tl.seek(0);
      window.__timelines["05-participants"] = tl;
    })();
