      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        /* Opaque stage ground = FRAME.md hero-purple, NOT white. Every cut-the-curve seam

           stage would strobe white through four cuts on purple/periwinkle frames. */

        height: 4.4cqw !important;

        align-items: center !important;
        justify-content: space-between !important;
        z-index: 30 !important;
        pointer-events: none;
        font-family: "Open Sans";

        left: 0;
        right: 0;
        top: -0.8cqw;
        border-top: 1px solid rgba(255,255,255,.28);

      #root .feedback-brand-rail img {
        display: block !important;
        width: 13.02cqw !important;

        padding: 0;

        background: transparent;
        padding: 0;
        border-radius: 0;
        white-space: nowrap;

        border-top-color: rgba(0,42,58,.18);

        filter: none;
      }
