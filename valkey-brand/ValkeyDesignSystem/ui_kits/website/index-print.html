<style>*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
*{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}
doc-page:not(:defined){visibility:hidden}
a{color:var(--color-link)}a:hover{color:var(--valkey-purple-indigo)}
.screen{break-before:page}.screen:first-child{break-before:auto}
.screen-label{font-family:var(--font-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted);padding:6px 20px;border-bottom:1px solid var(--color-border);background:var(--valkey-best-white)}

<script type="text/babel">
function PrintDoc(){
  const screens=[["Home",window.HomeScreen],["Documentation: Quickstart",window.DocsScreen],["Documentation: Command Reference",window.CommandsScreen],["Blog",window.BlogScreen],["Community",window.CommunityScreen]];
  return <div>{screens.map(([label,S])=> <section className="screen" key={label}><div className="screen-label">valkey.io — {label}</div><S /></section>)}</div>;
}
(function boot(){
  const ns=window.ValkeyDesignSystem_d3b98f;
  if(!ns||!ns.Button||!window.HomeScreen||!window.CommunityScreen){return setTimeout(boot,30);}
  ReactDOM.createRoot(document.getElementById("root")).render(<PrintDoc />);
})();
</script>
