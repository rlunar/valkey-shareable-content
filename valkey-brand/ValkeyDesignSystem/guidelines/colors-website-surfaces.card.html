<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--valkey-best-white);font-family:var(--font-body)}.sw{display:flex;gap:10px}.sw>div{flex:1;border-radius:10px;overflow:hidden;border:1px solid var(--color-border)}.chip{height:64px}.lbl{padding:8px 10px;font-size:12px;line-height:1.35}.name{font-weight:600;display:block}.hex{font-family:var(--font-code);font-size:11px;color:var(--color-text-muted)}</style></head><body>
<div class="sw">
<div><div class="chip" style="background:#2D2471"></div><div class="lbl"><span class="name">Deep purple card</span><span class="hex">#2D2471</span></div></div>
<div><div class="chip" style="background:#E2E8F0"></div><div class="lbl"><span class="name">Page shade</span><span class="hex">#E2E8F0</span></div></div>
<div><div class="chip" style="background:#F1F0FA"></div><div class="lbl"><span class="name">Aside shade</span><span class="hex">#F1F0FA</span></div></div>
<div><div class="chip" style="background:#D1D9FF"></div><div class="lbl"><span class="name">Aside link block</span><span class="hex">#D1D9FF</span></div></div>
<div><div class="chip" style="background:#2054B2"></div><div class="lbl"><span class="name">Link blue</span><span class="hex">#2054B2</span></div></div>
</div>
</body></html>
